# Global defaults (inherited by all phases unless overridden)
runner = "claude"
agent_model = "claude-opus-4-6"
agent_effort = "high"
agent_timeout = 600

# Per-phase overrides
[[review_phases]]
name = "correctness"
prompt = "correctness-review"

[[review_phases]]
name = "security"
prompt = "security-review"
runner = "claude"

[[review_phases]]
name = "hygiene"
prompt = "hygiene-review"
runner = "claude"
agent_model = "claude-sonnet-4-6"
agent_effort = "high"

[review_aggregate]
runner = "claude"
agent_effort = "medium"

[fix]
runner = "claude"
agent_model = "claude-sonnet-4-6"
agent_effort = "high"
